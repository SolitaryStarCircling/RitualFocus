    $('#colorRow').addEventListener('click', function (e) {
      var btn = e.target.closest('.color-opt');
      if (!btn) return;
      pickerColor = btn.dataset.color;
      $$('#colorRow .color-opt').forEach(function (b) { b.classList.toggle('active', b === btn); });
    });

    /* 习惯菜单 */
    $('#habitMenuMask').addEventListener('click', closeHabitMenu);
    $('#habitMenu').addEventListener('click', function (e) {
      var action = e.target.closest('[data-habit-action]');
      if (!action) return;
      if (action.dataset.habitAction === 'delete') deleteHabit();
      else if (action.dataset.habitAction === 'schedule') openEditSchedule();
      else closeHabitMenu();
    });

    /* 专注计时 */
    $('#startBtn').addEventListener('click', toggleTimer);
    $('#resetBtn').addEventListener('click', resetTimer);

    /* 统计视图切换 */
    $$('.view-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        heatView = btn.dataset.view;
        $$('.view-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
        renderHabitHeatmap();
        hideTooltip();
      });
    });

    /* 设置 */
    $('#settingsMask').addEventListener('click', function () { closeSheet('settingsSheet', 'settingsMask'); });
    $('#settingsDoneBtn').addEventListener('click', function () { closeSheet('settingsSheet', 'settingsMask'); });
    $$('#themeSegmented button').forEach(function (btn) {
      btn.addEventListener('click', function () { setTheme(btn.dataset.theme); });
    });

    function commitDuration(input, key) {
      var value = Number(input.value);
      if (!isFinite(value) || value < 10 || value > 90) {
        input.value = data.settings[key];
        showToast('时长需在 10 - 90 分钟之间');
        return;
      }
      value = Math.round(value);
      data.settings[key] = value;
      input.value = value;
      save();
      applyDurations();
      showToast('已更新时长');
    }

    $('#focusInput').addEventListener('change', function () {
      commitDuration(this, 'focusDuration');
    });
    $('#breakInput').addEventListener('change', function () {
      commitDuration(this, 'breakDuration');
    });

    $$('[data-export]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.export === 'json') exportJSON();
        else exportCSV();
      });
    });

    /* Tooltip */
    ['mouseover', 'mousemove'].forEach(function (evt) {
      document.addEventListener(evt, function (e) {
        var cell = e.target.closest ? e.target.closest('.hm-cell[data-date], .heatmap-cell[data-date]') : null;
        if (cell && cell !== tooltipCell) showTooltip(cell);
      });
    });
    ['mouseout', 'scroll'].forEach(function (evt) {
      document.addEventListener(evt, function (e) {
        if (evt === 'scroll' || (e.target.closest && e.target.closest('.hm-cell, .heatmap-cell'))) {
          hideTooltip();
        }
      }, true);
    });
    document.addEventListener('click', function (e) {
      var cell = e.target.closest ? e.target.closest('.hm-cell[data-date], .heatmap-cell[data-date]') : null;
      if (cell) showTooltip(cell);
      else if (e.target.closest && !e.target.closest('#tooltip')) hideTooltip();
    });
    window.addEventListener('resize', hideTooltip);

    /* 键盘 */
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

      if (e.key === 'Escape') {
        closeSheet('addSheet', 'addMask');
        closeSheet('settingsSheet', 'settingsMask');
        closeSheet('editScheduleSheet', 'editScheduleMask');
        closeHabitMenu();
        hideTooltip();
        return;
      }
      if (e.code === 'Space' || e.key === ' ') {
        if (currentTab !== 'focus') return;
        if ($('#addSheet').classList.contains('show') ||
            $('#settingsSheet').classList.contains('show')) return;
        e.preventDefault();
        toggleTimer();
      }
    });
  }

  /* ==========================================================
     Init
     ========================================================== */
  function restoreRuntime() {
    if (rt.isRunning) {
      if (rt.endAt <= Date.now()) {
        finishCycle();
      } else {
        rt.remaining = Math.max(0, Math.ceil((rt.endAt - Date.now()) / 1000));
      }
    } else {
      rt.total = rt.total || modeTotalSeconds(rt.mode);
      if (rt.remaining > rt.total) rt.remaining = rt.total;
    }
  }
